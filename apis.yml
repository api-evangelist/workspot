aid: workspot
name: Workspot
description: Workspot is a cloud-native virtual desktop infrastructure (VDI) and Cloud PC provider delivering
  Desktop-as-a-Service through its Workspot Control SaaS plane and the Workspot Desktop Control Fabric,
  a globally distributed architecture that provisions and manages Windows desktops and published applications
  across Microsoft Azure, Google Cloud and Amazon WorkSpaces Core. Workspot publishes a Workspot Control
  REST API for IT service management, automation and scripting tools — 105 operations covering desktop
  pools, desktops, users, groups, templates, application bundles, cloud app server pools, RD gateway clusters,
  licenses and usage reporting — plus a separate HMAC-authenticated SIEM/Splunk events API for streaming
  admin and end-user event data into security tooling. It serves regulated and design-heavy industries
  including finance, legal, healthcare, manufacturing, life sciences, construction, retail and education.
