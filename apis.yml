apis:
- aid: workspot:control
  name: Workspot Control REST API
  description: REST API for Workspot Control, the SaaS management plane for Workspot Cloud PCs. 105 operations
    across 85 paths for IT Service Management (ITSM), automation and scripting tools — provisioning and
    lifecycle of desktop pools and desktops, user and group assignment, template build/clone/publish,
    cloud application server pools and published applications, RD gateway clusters, cloud/region/zone/network
    discovery, licenses, stale devices and usage reporting. OAuth 2.0 or Microsoft Entra ID token authentication;
    many operations are asynchronous and return a StatusURL to poll.
  humanURL: https://docs.workspot.com/docs/using-the-workspot-control-api
  baseURL: https://api.workspot.com
