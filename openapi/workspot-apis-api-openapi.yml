  /v1.0/users/{email}/globalDesktops/{globalDesktopId}/pools:
    post:
      tags:
      - APIs
      summary: Assign pools to user’s global desktop application
      description: 'Assign the pools with order of precedence to user’s global desktop application. This is an asynchronous command.


        Supported Clouds: Azure, GCP, Amazon WorkSpaces Core'
      operationId: setGlobalDesktopPoolsUsingPOST
      parameters:
      - name: email
        in: path
        description: '<span style="font-family: Open Sans,sans-serif; font-size:13px">Email id of user'
        required: true
        schema:
          type: string
      - name: globalDesktopId
        in: path
        description: '<span style="font-family: Open Sans,sans-serif; font-size:13px">Global Desktop Application Id for the User'
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Request accepted. Returns a statusURL for polling, which is an instance of the GET /v1.0/operation/{operationId} command.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncOperationStatus'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      deprecated: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VDIPoolDetails'
        description: '<span style="font-family: Open Sans,sans-serif; font-size:13px">Pool IDs and precedence to be assigned to override predefined global desktop pools. Order of precedence is a positive integer, with 1 being the highest precedence. Precedence must be given with no gaps (1, 2, 3; not 1, 4, 9).'
    delete:
      tags:
      - APIs
      summary: Deallocate the pools from user’s global desktop application
      description: 'Deallocate the pools from user’s global desktop application, keeping the relative precedence for rest of the pools but renumbering them starting at 1. This is a synchronous command.


        Supported Clouds: Azure, GCP, Amazon WorkSpaces Core'
      operationId: deleteGlobalDesktopPoolsUsingDELETE
      parameters:
      - name: email
        in: path
        description: '<span style="font-family: Open Sans,sans-serif; font-size:13px">Email id of user'
        required: true
        schema:
          type: string
      - name: globalDesktopId
        in: path
        description: '<span style="font-family: Open Sans,sans-serif; font-size:13px">Global desktop Application Id.'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Pools assigned to user’s global desktop application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserGlobalDesktopPoolDetailsBO'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      deprecated: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pool_to_Delete_from_GlobalDesktop'
        description: '<span style="font-family: Open Sans,sans-serif; font-size:13px">PoolId to be deallocated from user’s global desktop application.'
        required: true
  /v1.0/users/{email}/logoff:
    post:
      tags:
      - APIs
      summary: Signs a user out of a desktop session
      description: 'Signs the user out of Windows on the specified desktop. This is an asynchronous command.


        Supported Clouds: Azure, GCP, Amazon WorkSpaces Core'
      operationId: logoffUserUsingPOST
