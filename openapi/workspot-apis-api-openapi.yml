        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pool_to_Assign'
        description: '<span style="font-family: Open Sans,sans-serif; font-size:13px">poolID of pool to assign to the user'
        required: true
  /v1.0/users/{email}/refreshGroupEntitlements:
    post:
