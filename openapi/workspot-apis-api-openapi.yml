        required: true
  /v1.0/users/{email}/sendMessage:
    post:
      tags:
      - APIs
      summary: Sends a message to a user's desktop
      description: 'Send a brief message to the specified desktop of a single user. This is typically used to warn users of impending shutdowns. This is an asynchronous command.


        Supported Clouds: Azure, GCP, Amazon WorkSpaces Core'
      operationId: sendMessageToUserUsingPOST
