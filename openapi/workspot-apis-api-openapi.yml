  /v1.0/users/{email}/pools:
    post:
      tags:
      - APIs
      summary: Assigns a user to a given pool
      description: 'Assigns a desktop from a pool to the user. If a desktop is not available, a desktop is created and assigned to the user. This is an asynchronous command.


        Supported Clouds: Azure, GCP, Amazon WorkSpaces Core, Akamai'
      operationId: assignPoolUsingPOST
      parameters:
      - name: email
        in: path
        description: '<span style="font-family: Open Sans,sans-serif; font-size:13px">The user''s email address'
