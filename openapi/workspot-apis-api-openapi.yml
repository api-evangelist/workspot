openapi: 3.2.0
info:
  description: REST APIs for IT Service Management (ITSM), automation or scripting tools
  version: '1.0'
  title: Workspot Control REST AP Is API
  termsOfService: https://www.workspot.com/legal/desktop-service-daas-subscription-agreement/
  contact:
    name: support@workspot.com
servers:
- url: https://api.workspot.com/
tags:
- name: APIs
  description: Workspot Control REST interface for administrators. See the descriptions below and Using the Workspot Control API for additional information
paths:
  /v1.0/bundles:
    get:
      tags:
      - APIs
      summary: Returns a list of all application bundles
      description: Returns a list of all application bundles along with their associated apps and groups. This is a synchronous command.
      operationId: bundlesUsingGET
      responses:
        '200':
          description: List of application bundles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BundlesDTO'
        '400':
          description: Error message with details
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      deprecated: false
    post:
      tags:
      - APIs
      summary: Creates a new application bundle
      description: Creates a new application bundle with a name and a list of associated applications.
      operationId: createBundleUsingPOST
      responses:
        '200':
          description: Success. Bundle created Successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCreateBundleResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      deprecated: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBundleRequestDTO'
        description: '<span style="font-family: Open Sans,sans-serif; font-size:13px">Bundle information.'
        required: true
  /v1.0/bundles/{bundleId}:
    get:
      tags:
      - APIs
      summary: Returns an application bundle details
      description: Returns an application bundle along with their associated apps and groups. This is a synchronous command.
      operationId: bundleInfoUsingGET
      parameters:
      - name: bundleId
        in: path
        description: '<span style="font-family: Open Sans,sans-serif; font-size:13px">The ID string of the bundle. This is obtained through the GET /v1.0/bundles command.'
        required: true
        x-example: f81eed06-c7a0-46b1-a3bf-50cc8880310b
        schema:
          type: string
      responses:
        '200':
          description: Application bundle details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BundleDetails'
        '400':
          description: Error message with details
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      deprecated: false
    post:
      tags:
      - APIs
      summary: Updates an existing application bundle
      description: Updates an existing application bundle, specified by its bundleID, with a new properties and list of associated applications.
      operationId: updateBundleUsingPOST
      parameters:
      - name: bundleId
        in: path
        description: '<span style="font-family: Open Sans,sans-serif; font-size:13px">The ID string for the Bundle. This is obtained through the GET /v1.0/bundles command and others.'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success. Bundle updated Successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCreateBundleResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      deprecated: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBundleRequestDTO'
        description: '<span style="font-family: Open Sans,sans-serif; font-size:13px">Bundle information.'
        required: true
    delete:
      tags:
      - APIs
      summary: Deletes an application bundle
      description: Deletes the specified application bundle.
      operationId: deleteBundleUsingDELETE
      parameters:
      - name: bundleId
        in: path
        description: '<span style="font-family: Open Sans,sans-serif; font-size:13px">The ID string for the bundle. This is obtained through the GET /v1.0/getBundles command.'
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No content (success)
        '400':
          description: Error message with details
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      deprecated: false
  /v1.0/cloudAppPools:
    get:
      tags:
      - APIs
      summary: Returns a list of all application server pools
      description: 'Returns a list of all application server pools, along with information about each pool, including its name, its pool id, and other information. The pool id is used by many commands to specify which pool to use. This is a synchronous command.


        Supported Clouds: Azure, GCP, Amazon WorkSpaces Core, Akamai'
      operationId: cloudAppPoolsUsingGET
      responses:
        '200':
          description: List of cloud app pools
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudAppPool'
        '400':
          description: Error message with details
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      deprecated: false
    post:
      tags:
      - APIs
      summary: Creates an application server pool
      description: 'Creates an application server pool.


        Supported Clouds: GCP'
      operationId: createCloudAppPoolUsingPOST
      responses:
        '200':
          description: Creates an application server pool.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCreateCloudAppPoolResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      deprecated: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCloudAppPool'
        description: '<span style="font-family: Open Sans,sans-serif; font-size:13px">Cloud app pool information.'
        required: true
  /v1.0/cloudAppPools/applications:
    get:
      tags:
      - APIs
      summary: Returns a list of all application server applications
      description: 'Returns a list of all applications served by any application server pool (but not other kinds of RD application or Web application). This is a synchronous command.


        Supported Clouds: Azure, GCP, Amazon WorkSpaces Core'
      operationId: applicationsUsingGET
      responses:
        '200':
          description: List of all application server applications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Applications'
        '400':
          description: Error message with details
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      deprecated: false
    post:
      tags:
      - APIs
      summary: Creates an application
      description: 'Creates an application server application.


        Supported Clouds: Azure, GCP, Amazon WorkSpaces Core, Akamai'
      operationId: createCloudAppUsingPOST
      responses:
        '200':
          description: Application server application created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCreateCloudAppResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      deprecated: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCloudAppRequest'
        description: '<span style="font-family: Open Sans,sans-serif; font-size:13px">Cloud app  information.'
        required: true
  /v1.0/cloudAppPools/applications/{appId}:
    get:
      tags:
      - APIs
      summary: Returns application details
      description: 'Returns details about the specified application (application server applications only). This is a synchronous command.


        Supported Clouds: Azure, GCP, Amazon WorkSpaces Core'
      operationId: appDetailsUsingGET
      parameters:
      - name: appId
        in: path
        description: '<span style="font-family: Open Sans,sans-serif; font-size:13px">The ID string for the application. This is obtained through the GET /v1.0/applications command and others.'
        required: true
        x-example: f81eed06-c7a0-46b1-a3bf-50cc8880310b
        schema:
          type: string
      responses:
        '200':
          description: Application details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDetails'
        '400':
          description: Error message with details
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      deprecated: false
    post:
      tags:
      - APIs
      summary: Updates an application
      description: 'Updates an application server application.


        Supported Clouds: Azure, GCP, Amazon WorkSpaces Core'
      operationId: updateCloudAppUsingPOST
      parameters:
      - name: appId
        in: path
        description: '<span style="font-family: Open Sans,sans-serif; font-size:13px">The ID string of the application. This is obtained through the GET /v1.0//cloudAppPools/applications command.'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Application server application succesfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCreateCloudAppResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      deprecated: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCloudAppRequest'
        description: '<span style="font-family: Open Sans,sans-serif; font-size:13px">Application server application information.'
        required: true
    delete:
      tags:
      - APIs
      summary: Deletes an application
      description: 'Deletes the specified application.


        Supported Clouds: Azure, GCP, Amazon WorkSpaces Core, Akamai'
      operationId: deletecloudAppUsingDELETE
      parameters:
      - name: appId
        in: path
        description: '<span style="font-family: Open Sans,sans-serif; font-size:13px">The ID string of the application. This is obtained through the GET /v1.0/cloudAppPools/applications command.'
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No content (success)
        '400':
          description: Error message with details
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      deprecated: false
  /v1.0/cloudAppPools/applications/{appId}/icon:
    post:
      tags:
      - APIs
      summary: Updates an application icon
      description: 'Updates the icon of the specified application. Attach the image as the ''icon'' form field, e.g. curl -F "icon=@C:\path\to\myicon.png".


        Supported Clouds: Azure, GCP, Amazon WorkSpaces Core, Akamai'
      operationId: uploadCloudAppIconUsingPOST
      parameters:
      - name: appId
        in: path
        description: '<span style="font-family: Open Sans,sans-serif; font-size:13px">The ID string of the application. Obtained through GET /v1.0/cloudAppPools/applications.'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Application icon updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCreateCloudAppResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '413':
          description: The icon exceeds the maximum allowed size (100 KB)
      deprecated: false
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                icon:
                  type: string
                  description: '<span style="font-family: Open Sans,sans-serif; font-size:13px">The image file to upload as the app icon (max 100 KB).'
                  format: binary
              required:
              - icon
  /v1.0/cloudAppPools/{cloudAppPoolId}:
    get:
      tags:
      - APIs
      summary: Returns the details about an application server pool
      description: 'Return the details about the specified application server pool. This is a synchronous command.


        Supported Clouds: Azure, GCP, Amazon WorkSpaces Core, Akamai'
      operationId: cloudAppPoolInfoUsingGET
      parameters:
      - name: cloudAppPoolId
        in: path
        description: '<span style="font-family: Open Sans,sans-serif; font-size:13px">The ID string of the application server. This is obtained through the GET /v1.0/cloudAppPools command and others.'
        required: true
        x-example: f81eed06-c7a0-46b1-a3bf-50cc8880310b
        schema:
          type: string
      responses:
        '200':
          description: Details about the pool
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudAppPoolDetails'
        '400':
          description: Error message with details
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      deprecated: false
    delete:
      tags:
      - APIs
      summary: Deletes an application server pool
      description: 'Deletes the specified application server pool.


        Supported Clouds: Azure, GCP, Amazon WorkSpaces Core, Akamai'
      operationId: deletecloudAppPoolUsingDELETE
      parameters:
      - name: cloudAppPoolId
        in: path
        description: '<span style="font-family: Open Sans,sans-serif; font-size:13px">The ID string of application server pool. This is obtained through the GET /v1.0/cloudAppPools command.'
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No content (success)
        '400':
          description: Error message with details
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      deprecated: false
  /v1.0/cloudAppPools/{cloudAppPoolId}/appServers:
    get:
      tags:
      - APIs
      summary: Returns a list of application servers in a pool
      description: 'Returns information about every application server in the specified applicaton server pool, including the server IDs used for commands that operate on a specified server. This is a synchronous command.


        Supported Clouds: Azure, GCP, Amazon WorkSpaces Core, Akamai'
      operationId: cloudAppServersUsingGET
      parameters:
      - name: cloudAppPoolId
        in: path
        description: '<span style="font-family: Open Sans,sans-serif; font-size:13px">The ID string of the application server. This is obtained through the GET /v1.0/cloudAppPools command and others.'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: List of app servers in cloud app pool
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudAppServers'
        '400':
          description: Error message with details
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      deprecated: false
  /v1.0/cloudAppPools/{cloudAppPoolId}/appServers/{appServerId}:
    get:
      tags:
      - APIs
      summary: Returns details for a single application server
      description: 'Returns the details for a single application server in a specified application server pool. This is a synchronous command.


        Supported Clouds: Azure, GCP, Amazon WorkSpaces Core'
      operationId: appServerDeatilsUsingGET
      parameters:
      - name: appServerId
        in: path
        description: '<span style="font-family: Open Sans,sans-serif; font-size:13px">The ID string for the cloud app server. This is obtained through the GET /v1.0/cloudAppPools/{cloudAppPoolId}/appServers command and others.'
        required: true
        schema:
          type: string
      - name: cloudAppPoolId
        in: path
        description: '<span style="font-family: Open Sans,sans-serif; font-size:13px">The ID string for the cloud app pool. This is obtained through the GET /v1.0/cloudAppPools command and others.'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Details of the specified application server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudAppServerDetails'
        '400':
          description: Error message with details
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      deprecated: false
    delete:
      tags:
      - APIs
      summary: Deletes a Cloud app server
      description: 'Deletes the specified cloud app server


        Supported Clouds: Azure, GCP, Amazon WorkSpaces Core, Akamai'
      operationId: deletecloudAppServerUsingDELETE
      parameters:
      - name: appServerId
        in: path
        description: '<span style="font-family: Open Sans,sans-serif; font-size:13px">The ID string for the cloud app server. This is obtained through the GET /v1.0/cloudAppPools/{cloudAppPoolId}/appServers command and others.'
        required: true
        schema:
          type: string
      - name: cloudAppPoolId
        in: path
        description: '<span style="font-family: Open Sans,sans-serif; font-size:13px">The ID string for the cloud app pool. This is obtained through the GET /v1.0/cloudAppPools command and others.'
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No content (success)
        '400':
          description: Error message with details
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      deprecated: false
  /v1.0/cloudAppPools/{poolId}:
    post:
      tags:
      - APIs
      summary: Updates an application server pool
      description: 'Updates an application server pool.


        Supported Clouds: GCP'
      operationId: updateCloudAppPoolUsingPOST
      parameters:
      - name: poolId
        in: path
        description: '<span style="font-family: Open Sans,sans-serif; font-size:13px">The ID string of the application server. This is obtained through the GET /v1.0/pools command and others.'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Updates the parameters of an application server pool.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCreateCloudAppPoolResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      deprecated: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCloudAppPool'
        description: '<span style="font-family: Open Sans,sans-serif; font-size:13px">Application server details to updated.'
        required: true
  /v1.0/clouds:
    get:
      tags:
      - APIs
      summary: Returns information about public clouds
      description: 'Supported Clouds: Azure, GCP, Amazon WorkSpaces Core, Akamai'
      operationId: publicCloudsUsingGET
      responses:
        '200':
          description: Returns Cloud subscription details. This is a synchronous command.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudConfigSubscriptions'
        '400':
          description: Error message with details
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      deprecated: false
  /v1.0/clouds/rdgateways/images:
    get:
      tags:
      - APIs
      summary: Returns information Market place images required to create gateway cluster…
      description: 'Returns information about marketplace images. This is a synchronous command.


        Supported Clouds: Azure, GCP, Amazon WorkSpaces Core'
      operationId: getGatewayImagesUsingGET
      parameters:
      - name: subscriptionName
        in: query
        description: '<span style="font-family: Open Sans,sans-serif; font-size:13px">The subscription name from the GET /v1.0/clouds command'
        required: true
        allowEmptyValue: false
        schema:
          type: string
      responses:
        '200':
          description: Returns details about market place images). This is a synchronous command.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudImages'
        '400':
          description: Error message with details
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      deprecated: false
  /v1.0/clouds/rdgateways/vmClasses:
    get:
      tags:
      - APIs
      summary: Returns information about VM Classes required to create gateway cluster…
      description: 'Returns information of VM Classes. This is a synchronous command. See Gateway Clusters (Managed Gateways) for more information


        Supported Clouds: Azure, GCP, Amazon WorkSpaces Core'
      operationId: getGatewayVmClassesUsingGET
      parameters:
      - name: subscriptionName
        in: query
        description: '<span style="font-family: Open Sans,sans-serif; font-size:13px">The subscription name from the GET /v1.0/clouds command'
        required: true
        allowEmptyValue: false
        schema:
          type: string
      responses:
        '200':
          description: Returns information of VM Classes. This is a synchronous command.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VmClasses'
        '400':
          description: Error message with details
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      deprecated: false
  /v1.0/clouds/{subscriptionName}/customImages:
    get:
      tags:
      - APIs
      summary: Returns information about Custom Images
      description: 'Supported Clouds: GCP, Amazon WorkSpaces Core'
      operationId: customImagesUsingGET
      parameters:
      - name: subscriptionName
        in: path
        description: '<span style="font-family: Open Sans,sans-serif; font-size:13px">The subscription name from the GET /v1.0/clouds command'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Returns Custom Image details. This is a synchronous command.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomImageResponse'
        '400':
          description: Error message with details
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      deprecated: false
    post:
      tags:
      - APIs
      summary: Adds a new Custom Image
      description: 'Supported Clouds: GCP, Amazon WorkSpaces Core'
      operationId: createCustomImagesUsingPOST
      parameters:
      - name: subscriptionName
        in: path
        description: '<span style="font-family: Open Sans,sans-serif; font-size:13px">The subscription name from the GET /v1.0/clouds command'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Custom Image added successfully. This is a synchronous command.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiStatusResponse'
        '400':
          description: Error message with details
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      deprecated: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCustomImageRequest'
        description: '<span style="font-family: Open Sans,sans-serif; font-size:13px">Custom Image information.'
        required: true
  /v1.0/clouds/{subscriptionName}/networks:
    get:
      tags:
      - APIs
      summary: Returns information about Cloud networks
      description: 'Returns information of cloud networks. This is a synchronous command.


        Supported Clouds: GCP'
      operationId: getCloudNetworksUsingGET
      parameters:
      - name: subscriptionName
        in: path
        description: '<span style="font-family: Open Sans,sans-serif; font-size:13px">The subscription name from the GET /v1.0/clouds command'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Returns information about Cloud Networks. This is a synchronous command.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCloudNetworksListResponse'
        '400':
          description: Error message with details
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      deprecated: false
  /v1.0/clouds/{subscriptionName}/regions:
    get:
      tags:
      - APIs
      summary: Returns list of regions
      description: 'Returns information about regions. Only applicable for AWS subscriptions. This is a synchronous command.


        Supported Clouds: Amazon WorkSpaces Core'
      operationId: getRegionsUsingGET
      parameters:
      - name: subscriptionName
        in: path
        description: The subscription name from the GET /v1.0/clouds command
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Returns list  of regions. This is a synchronous command.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Regions'
        '400':
          description: Error message with details. Returns Bad request for GCP and Azure clouds
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      deprecated: false
  /v1.0/clouds/{subscriptionName}/regions/{region}/networks:
    get:
      tags:
      - APIs
      summary: Returns information about Cloud networks in a region
      description: 'Returns information of cloud networks in a given region. Only applicable for AWS subscriptions. This is a synchronous command.


        Supported Clouds: Amazon WorkSpaces Core'
      operationId: getCloudNetworksByRegionUsingGET
      parameters:
      - name: region
        in: path
        description: '<span style="font-family: Open Sans,sans-serif; font-size:13px">The region name from the GET /v1.0/clouds/{subscriptionName}/regions command'
        required: true
        schema:
          type: string
      - name: subscriptionName
        in: path
        description: '<span style="font-family: Open Sans,sans-serif; font-size:13px">The subscription name from the GET /v1.0/clouds command'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Returns information of Cloud networks in a region. This is a synchronous command.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCloudNetworksListResponse'
        '400':
          description: Error message with details
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      deprecated: false
  /v1.0/clouds/{subscriptionName}/regions/{region}/securityGroups:
    get:
      tags:
      - APIs
      summary: Returns information AWS security groups
      description: 'Returns information AWS security groups. This is a synchronous command.


        Supported Clouds: Amazon WorkSpaces Core'
      operationId: getSecurityGroupsUsingGET
      parameters:
      - name: region
        in: path
        description: '<span style="font-family: Open Sans,sans-serif; font-size:13px">The region name from the GET /v1.0/clouds/{subscriptionName}/regions command'
        required: true
        schema:
          type: string
