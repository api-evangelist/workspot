domain_standards:
  note: >-
    Virtual desktop infrastructure has no cross-vendor interoperability contract standard
    (no equivalent of FHIR, SCIM, OData or OpenRTB) for desktop provisioning or session
    brokering. Workspot's integration surface is instead cloud-provider-native (Azure, GCP,
    Amazon WorkSpaces Core) and protocol-native (RDP via managed RD gateways). REWARD-ONLY
    dimension: no domain standard is asserted because none exists for this market, not
    because Workspot failed to adopt one.
