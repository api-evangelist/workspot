notes: Entities are derived from the Workspot Control Swagger 2.0 definitions and path structure. Workspot addresses
  several entities by NAME rather than by opaque id (templateName, clusterName, gatewayName, poolName) and addresses
  users by EMAIL — an unusual choice worth noting for agents building URLs.
entities:
- name: Desktop Pool
  collection: /v1.0/pools
  identifier: poolId
  description: A group of desktops sharing a template, VM class, cloud region and policy. The central provisioning
    unit.
- name: Desktop
  collection: /v1.0/pools/{poolId}/desktops
  identifier: desktopId
  description: An individual Cloud PC VM inside a pool, assignable to a user; supports pause/resume/reboot/redeploy/move/upgrade.
- name: User
  collection: /v1.0/users/{email}
  identifier: email
  description: An end user, addressed by email address rather than an opaque id, holding desktop and global-desktop
    assignments and a cost center.
- name: Group
  collection: /v1.0/groups
  identifier: groupId
  description: A directory group used to assign application bundles and global desktops in bulk.
- name: Application Bundle
  collection: /v1.0/bundles
  identifier: bundleId
  description: A named collection of applications assignable to a user group.
- name: Cloud App Pool
  collection: /v1.0/cloudAppPools
  identifier: cloudAppPoolId
  description: A pool of application servers hosting published applications.
- name: Application
  collection: /v1.0/cloudAppPools/applications
  identifier: appId
  description: A published application served from an app server pool, with an optional custom icon.
- name: App Server
  collection: /v1.0/cloudAppPools/{cloudAppPoolId}/appServers
  identifier: appServerId
  description: An individual application server VM inside a cloud app pool.
- name: Template
  collection: /v1.0/clouds/{subscriptionName}/templates
  identifier: templateName
  description: A golden image, addressed by name, supporting build/register/clone/draft/preview/publish.
- name: Cloud Subscription
  collection: /v1.0/clouds
  identifier: subscriptionName
  description: A connected Azure/GCP/AWS subscription, the parent of regions, zones, networks, security groups and
    templates.
- name: Gateway Cluster
  collection: /v1.0/rdgateways/clusters
  identifier: clusterId
  description: A managed RD gateway cluster spanning regions, containing gateway hosts.
- name: Gateway
  collection: /v1.0/rdgateways/clusters/{clusterName}/gateways
  identifier: gatewayId
  description: An individual RD gateway host within a cluster, with connection and performance telemetry.
- name: Global Desktop
  collection: /v1.0/globalDesktops
  identifier: globalDesktopId
  description: A multi-region desktop application backed by several pools for failover.
- name: Operation
  collection: /v1.0/operation/{operationId}
  identifier: operationId
  description: The asynchronous job record every long-running command returns via StatusURL.
- name: License
  collection: /v1.0/licenses
  identifier: '-'
  description: Purchased license counts per VM type.
- name: Stale Device
  collection: /v1.0/staleDevices
  identifier: deviceId
  description: A device record no longer active, listable by date range and deletable in bulk.
- name: Policy
  collection: /v1.0/policies
  identifier: '-'
  description: A Control policy applied to pools and users.
