  tool set and its inputSchemas could not be enumerated anonymously and tools[] is left
  EMPTY rather than guessed.
  SCOPE CAVEAT, stated plainly: this server is the WordPress MCP adapter plugin running on
  the workspot.com MARKETING site. Nothing Workspot publishes connects it to the Workspot
  Control REST API, and its single advertised scope is "mcp". It should not be read as an
  agent surface over Cloud PC provisioning. No MCP server for the Control API was found, so
  no tool crosswalk is emitted — a crosswalk between this server and the Control OpenAPI
  would assert a binding that does not exist.
