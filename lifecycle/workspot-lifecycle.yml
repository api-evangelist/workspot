stale_pointer_finding:
  field: info.termsOfService in the published Swagger
  url: https://www.workspot.com/legal/desktop-service-daas-subscription-agreement/
  observed_status: 200
  verdict: soft-404 — resolves but renders the legal INDEX, byte-identical to https://www.workspot.com/legal/,
    not the agreement
  current_document: https://www.workspot.com/legal/workspot-enterprise-subscription-agreement/
  note: Workspot's own machine-readable contract points termsOfService at a document URL that no longer
    serves that document. The agreement appears to have been renamed from 'Desktop Service DaaS Subscription
    Agreement' to 'Workspot Enterprise Subscription Agreement' without the spec being updated. A consumer
    following the spec lands on an index page. Reported here rather than silently corrected in the harvested
    spec, which is preserved verbatim.
