known_limitations:
- The gateway reboot command is currently synchronous but Workspot states it will become asynchronous.
- redeploy, screenshotDesktop, moveDesktop and cancelMoveDesktop are not available on GCP.
- moveDesktop and cancelMoveDesktop are Azure-only and persistent-desktop-only.
